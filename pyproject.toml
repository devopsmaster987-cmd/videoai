[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeanimate-ai"
version = "1.0.0"
description = "FreeAnimate AI — free, multilingual, terminal-based AI animation and YouTube video creator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FreeAnimate AI contributors" }]
keywords = ["video", "animation", "ffmpeg", "tts", "subtitles", "youtube"]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
windows-tts = ["pyttsx3>=2.90"]
ai = ["diffusers>=0.30", "torch>=2.2", "huggingface_hub>=0.23"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
freeanimate = "freeanimate.cli:main"

[tool.setuptools.packages.find]
include = ["freeanimate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
